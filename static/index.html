<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多 Agent 智能客服运营中台</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel-2: #232735;
    --border: #2e3348;
    --text: #e4e6ef;
    --text-dim: #8b90a5;
    --accent: #6c8cff;
    --green: #3ddc97;
    --orange: #ffb454;
    --red: #ff6b81;
    --purple: #b57bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px;
    font-weight: 600; margin-left: 6px; vertical-align: middle;
  }
  .badge-rule_review { background: rgba(108,140,255,.15); color: var(--accent); }
  .badge-order_fulfill { background: rgba(61,220,151,.15); color: var(--green); }
  .badge-after_sale { background: rgba(255,180,84,.15); color: var(--orange); }
  .badge-chat { background: rgba(181,123,255,.15); color: var(--purple); }
  .badge-reject { background: rgba(255,107,129,.15); color: var(--red); }
  .badge-parallel { background: rgba(181,123,255,.2); color: var(--purple); }
  .badge-pending { background: rgba(139,144,165,.15); color: var(--text-dim); }

  main { flex: 1; overflow-y: auto; padding: 20px 24px; }

  /* ===== 节点链路进度条 ===== */
  .pipeline-bar {
    display: flex; align-items: center; gap: 0; margin: 10px 0 16px;
    padding: 12px 16px; background: var(--panel); border-radius: 8px;
  }
  .pipeline-node {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim);
    white-space: nowrap; transition: all .3s;
  }
  .pipeline-node .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border);
    transition: all .3s;
  }
  .pipeline-node.done { color: var(--green); }
  .pipeline-node.done .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .pipeline-node.active { color: var(--accent); }
  .pipeline-node.active .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .pipeline-connector {
    width: 24px; height: 2px; background: var(--border); margin: 0 4px;
    transition: background .3s;
  }
  .pipeline-connector.done { background: var(--green); }

  /* ===== 消息 ===== */
  .msg { margin-bottom: 16px; max-width: 78%; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .msg.user { margin-left: auto; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--panel-2); border-bottom-left-radius: 4px; }
  .meta-line { font-size: 11px; color: var(--text-dim); margin-top: 4px; padding: 0 4px; }
  .msg.user .meta-line { text-align: right; }

  .stage {
    margin: 6px 0; padding: 6px 12px; background: var(--panel); border-left: 3px solid var(--accent);
    border-radius: 4px; font-size: 12px; color: var(--text-dim);
  }
  .stage .stage-name { color: var(--text); font-weight: 600; }

  .approval-card {
    margin: 10px 0; padding: 14px; background: rgba(255,180,84,.08);
    border: 1px solid rgba(255,180,84,.3); border-radius: 8px;
  }
  .approval-card .title { font-size: 13px; color: var(--orange); font-weight: 600; margin-bottom: 8px; }
  .approval-card .payload { font-size: 12px; color: var(--text-dim); white-space: pre-wrap; margin-bottom: 10px; }
  .approval-card button {
    padding: 6px 16px; margin-right: 8px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600;
  }
  .btn-approve { background: var(--green); color: #0f1117; }
  .btn-reject { background: var(--red); color: #fff; }
  .btn-modify { background: var(--orange); color: #0f1117; }

  footer { padding: 14px 24px; background: var(--panel); border-top: 1px solid var(--border); }
  .examples { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .examples button {
    padding: 5px 12px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 14px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .examples button:hover { color: var(--accent); border-color: var(--accent); }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 11px 14px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    padding: 0 22px; background: var(--accent); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cursor::after { content: '▋'; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <h1>🏢 多 Agent 智能客服运营中台</h1>
  <div>
    <span id="routeBadge" class="badge badge-pending">待路由</span>
  </div>
</header>

<main id="chat">
  <div class="stage">
    <span class="stage-name">系统就绪</span> · 输入问题开始演示
  </div>
</main>

<footer>
  <div class="examples">
    <button onclick="fillExample('我要提报一条满200减30的大促规则，帮我审核能不能上线')">📋 规则提报</button>
    <button onclick="fillExample('帮我查一下订单 889923 到哪了，为什么还没发货')">📦 订单查询</button>
    <button onclick="fillExample('我要申请退款，这单收到的商品有破损，请走售后审批')">↩️ 售后退款</button>
    <button onclick="fillExample('你好啊')">💬 闲聊</button>
    <button onclick="fillExample('帮我查一下订单 889923 到哪了，顺便看看我之前申请的退款批了没有')">⚡ 多意图并行</button>
  </div>
  <div class="input-row">
    <input id="input" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off" />
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const routeBadge = document.getElementById('routeBadge');

let currentRequestNo = null;
let streamingBubble = null;
let pipelineBar = null;
let interrupted = false;

// 每个 Agent 的节点链路定义
const PIPELINES = {
  order_fulfill: ['意图路由', '解析订单号', '查询订单', '生成轨迹'],
  rule_review:   ['意图路由', 'RAG检索', '三专家评审', '终审评分'],
  after_sale:    ['意图路由', '风险拦截', '售后审批', '完成'],
  chat:          ['意图路由', 'LLM回复'],
  reject:        ['意图路由', '拦截']
};

function fillExample(t) { input.value = t; input.focus(); }
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function setRouteBadge(label, source) {
  routeBadge.className = 'badge badge-' + label;
  routeBadge.textContent = label + (source ? ' · ' + source : '');
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble"></div><div class="meta-line">你</div>`;
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addAIMsg() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="bubble cursor"></div><div class="meta-line">AI</div>`;
  chat.appendChild(div);
  streamingBubble = div.querySelector('.bubble');
  chat.scrollTop = chat.scrollHeight;
  return streamingBubble;
}

function addStage(name, status) {
  const div = document.createElement('div');
  div.className = 'stage';
  div.innerHTML = `<span class="stage-name"></span> · `;
  div.querySelector('.stage-name').textContent = name;
  div.append(status);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ===== 节点链路进度条 =====
function showPipeline(agentType) {
  if (agentType === 'chat' || agentType === 'reject' || agentType === 'rule_review') return; // 闲聊/拦截不显示节点链路
  const steps = PIPELINES[agentType];
  if (!steps) return;
  pipelineBar = document.createElement('div');
  pipelineBar.className = 'pipeline-bar';
  steps.forEach((step, i) => {
    const node = document.createElement('div');
    node.className = 'pipeline-node';
    node.dataset.step = step;
    node.innerHTML = `<div class="dot"></div><span>${step}</span>`;
    pipelineBar.appendChild(node);
    if (i < steps.length - 1) {
      const conn = document.createElement('div');
      conn.className = 'pipeline-connector';
      conn.dataset.idx = i;
      pipelineBar.appendChild(conn);
    }
  });
  chat.appendChild(pipelineBar);
  chat.scrollTop = chat.scrollHeight;
  // 标记第一个为 active
  updatePipeline(0);
}

function updatePipeline(currentStepIdx) {
  if (!pipelineBar) return;
  const nodes = pipelineBar.querySelectorAll('.pipeline-node');
  const conns = pipelineBar.querySelectorAll('.pipeline-connector');
  nodes.forEach((node, i) => {
    node.classList.remove('done', 'active');
    if (i < currentStepIdx) node.classList.add('done');
    else if (i === currentStepIdx) node.classList.add('active');
  });
  conns.forEach((conn, i) => {
    conn.classList.toggle('done', i < currentStepIdx);
  });
}

function completePipeline() {
  if (!pipelineBar) return;
  const nodes = pipelineBar.querySelectorAll('.pipeline-node');
  const conns = pipelineBar.querySelectorAll('.pipeline-connector');
  nodes.forEach(n => { n.classList.remove('active'); n.classList.add('done'); });
  conns.forEach(c => c.classList.add('done'));
  pipelineBar = null;
}

function addApprovalCard(stage, payload, requestNo) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.innerHTML = `
    <div class="title">⚠️ 人工审批中断 · ${stage}</div>
    <div class="payload"></div>
    <button class="btn-approve" onclick="resume(this, '${requestNo}', '${stage}', 'approve')">✓ 通过</button>
    <button class="btn-reject" onclick="resume(this, '${requestNo}', '${stage}', 'reject')">✗ 驳回</button>
    <button class="btn-modify" onclick="resume(this, '${requestNo}', '${stage}', 'modify')">✎ 修改</button>
  `;
  card.querySelector('.payload').textContent = JSON.stringify(payload, null, 2);
  chat.appendChild(card);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;
  addUserMsg(q);
  pipelineBar = null;
  interrupted = false;

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, user_id: 'demo-user', tenant_id: 'demo' })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) handleSSEFrame(frame);
    }
  } catch (e) {
    addStage('错误', e.message);
  } finally {
    if (streamingBubble) streamingBubble.classList.remove('cursor');
    if (!interrupted) completePipeline();
    interrupted = false;
    sendBtn.disabled = false;
  }
}

function handleSSEFrame(frame) {
  let event = 'message', dataStr = '';
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
  }
  if (!dataStr) return;
  let data;
  try { data = JSON.parse(dataStr); } catch { return; }

  switch (event) {
    case 'meta':
      currentRequestNo = data.request_no;
      break;
    case 'route':
      setRouteBadge(data.label, data.source);
      addStage('意图路由', `${data.label}（${data.source}）— ${data.reason}`);
      showPipeline(data.label);
      break;
    case 'progress':
      // 更新节点进度条
      if (pipelineBar) {
        const stepMap = {
          'order_fulfill': 2, 'rule_review': 2, 'after_sale': 2,
          'risk_intercept': 1
        };
        // 找到当前节点对应的索引
        const nodes = pipelineBar.querySelectorAll('.pipeline-node');
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i].dataset.step === data.stage || nodes[i].textContent.includes(data.stage.split('_')[0])) {
            updatePipeline(i);
            break;
          }
        }
      }
      break;
    case 'token':
      if (!streamingBubble) addAIMsg();
      streamingBubble.textContent += data.text;
      chat.scrollTop = chat.scrollHeight;
      break;
    case 'interrupt':
      interrupted = true;
      if (streamingBubble) { streamingBubble.classList.remove('cursor'); streamingBubble = null; }
      addApprovalCard(data.stage, data.payload, currentRequestNo);
      // interrupt 时进度条停在当前审批节点，不标完成
      if (pipelineBar) {
        const nodes = pipelineBar.querySelectorAll('.pipeline-node');
        // 找到审批节点（倒数第二个），标记为 active，前面都 done
        for (let i = 0; i < nodes.length - 1; i++) {
          nodes[i].classList.remove('active');
          nodes[i].classList.add('done');
        }
        if (nodes.length > 1) {
          nodes[nodes.length - 2].classList.add('active');
        }
      }
      break;
    case 'result':
      if (streamingBubble) { streamingBubble.classList.remove('cursor'); streamingBubble = null; }
      // result 文本已通过 token 事件推送，这里不再重复渲染
      break;
    case 'error':
      addStage('错误', data.msg);
      break;
    case 'done':
      if (streamingBubble) { streamingBubble.classList.remove('cursor'); streamingBubble = null; }
      break;
  }
}

async function resume(btn, requestNo, agentType, decision) {
  const card = btn.closest('.approval-card');
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  addStage('人工审批', `已提交：${decision}，恢复中断节点…`);
  try {
    const resp = await fetch('/api/human/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_no: requestNo, agent_type: agentType, decision: { action: decision, comment: '演示审批', reviewer_id: 'human' } })
    });
    const data = await resp.json();
    if (data.ok === false) {
      addStage('审批失败', data.error || JSON.stringify(data));
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    } else {
      addStage('审批完成', '已执行：' + decision);
      if (data.state && data.state.result) addStage('结果', data.state.result);
      card.style.opacity = '0.4';
      completePipeline(); // 审批完成后进度条走到最后
    }
  } catch (e) {
    addStage('审批失败', e.message);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}
</script>
</body>
</html>
